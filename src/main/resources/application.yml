server:
  port: 8080

spring:
  application:
    name: testpilot
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

testpilot:
  storage:
    project-path: storage/projects
  maven:
    # Maven 可执行文件，留空则按操作系统自动选择（Windows: mvn.cmd，其他: mvn）
    executable: ""
    # 执行超时（秒）
    timeout-seconds: 120
    # 日志最大保留字符数
    max-log-length: 51200
  jacoco:
    # JaCoCo Maven 插件版本（命令行调用，不修改用户 pom.xml）
    version: 0.8.11
  llm:
    base-url: https://ws-ksj13y5j5qjkb8jg.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    model: qwen-plus
    api-key: ${DASHSCOPE_API_KEY:}
    connect-timeout: 10
    read-timeout: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
